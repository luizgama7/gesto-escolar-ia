<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão Escolar - IA Preditiva</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            color: #333333;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            color: #555555;
        }
        select, input, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            margin-top: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
        .baixo-risco {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alto-risco {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Análise Preditiva de Risco Escolar</h2>

    <label for="select-aluno">Selecionar Aluno (SQLite):</label>
    <select id="select-aluno" onchange="carregarDadosAluno()">
        <option value="">Carregando alunos da nuvem...</option>
    </select>

    <form id="form-aluno">
        <label for="frequencia">Frequência (%):</label>
        <input type="number" id="frequencia" min="0" max="100" required readonly>

        <label for="nota_mat">Nota de Matemática:</label>
        <input type="number" id="nota_mat" step="0.1" min="0" max="10" required readonly>

        <label for="nota_port">Nota de Português:</label>
        <input type="number" id="nota_port" step="0.1" min="0" max="10" required readonly>

        <label for="historico_reprovacoes">Histórico de Reprovações:</label>
        <input type="number" id="historico_reprovacoes" min="0" required readonly>

        <button type="button" onclick="analisarRisco()">Analisar Risco com IA</button>
    </form>

    <div id="resultado" class="resultado"></div>
</div>

<script>
    // URL Base da API hospedada no Render
    const API_URL = 'https://gesto-escolar-ia.onrender.com';
    let alunosData = [];

    // Busca a lista de alunos do SQLite via API
    async function carregarAlunos() {
        try {
            const resposta = await fetch(`${API_URL}/alunos`);
            alunosData = await resposta.json();
            
            const select = document.getElementById('select-aluno');
            select.innerHTML = '<option value="">-- Selecione um aluno --</option>';

            alunosData.forEach(aluno => {
                const option = document.createElement('option');
                option.value = aluno.id;
                option.textContent = `${aluno.nome} (ID: ${aluno.id})`;
                select.appendChild(option);
            });
        } catch (erro) {
            console.error('Erro ao buscar alunos:', erro);
            document.getElementById('select-aluno').innerHTML = '<option value="">Erro ao carregar dados da API</option>';
        }
    }

    // Preenche os campos do formulário ao selecionar o aluno no menu suspenso
    function carregarDadosAluno() {
        const alunoId = parseInt(document.getElementById('select-aluno').value);
        const aluno = alunosData.find(a => a.id === alunoId);

        if (aluno) {
            document.getElementById('frequencia').value = aluno.frequencia;
            document.getElementById('nota_mat').value = aluno.nota_mat;
            document.getElementById('nota_port').value = aluno.nota_port;
            document.getElementById('historico_reprovacoes').value = aluno.historico_reprovacoes;
        } else {
            document.getElementById('form-aluno').reset();
        }

        document.getElementById('resultado').style.display = 'none';
    }

    // Envia o ID para o endpoint de predição da IA
    async function analisarRisco() {
        const alunoId = document.getElementById('select-aluno').value;

        if (!alunoId) {
            alert('Por favor, selecione um aluno na lista!');
            return;
        }

        const divResultado = document.getElementById('resultado');
        divResultado.style.display = 'block';
        divResultado.className = 'resultado';
        divResultado.textContent = 'Processando modelo de IA...';

        try {
            const resposta = await fetch(`${API_URL}/predict/${alunoId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });

            const dados = await resposta.json();

            if (dados.risco_evasao === 1) {
                divResultado.className = 'resultado alto-risco';
                divResultado.innerHTML = `⚠️ <strong>ALTO RISCO DE EVASÃO</strong><br>Probabilidade: ${(dados.probabilidade * 100).toFixed(1)}%`;
            } else {
                divResultado.className = 'resultado baixo-risco';
                divResultado.innerHTML = `✅ <strong>BAIXO RISCO DE EVASÃO</strong><br>Probabilidade de Risco: ${(dados.probabilidade * 100).toFixed(1)}%`;
            }
        } catch (erro) {
            console.error('Erro na análise:', erro);
            divResultado.className = 'resultado alto-risco';
            divResultado.textContent = 'Erro ao se comunicar com o servidor da IA.';
        }
    }

    // Inicializa a listagem ao carregar a página
    window.onload = carregarAlunos;
</script>

</body>
</html>
