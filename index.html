<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gesto Escolar IA - UNIVESP</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            color: #1e1b4b;
            margin-bottom: 25px;
        }
        .main-app {
            display: none;
            width: 100%;
            max-width: 700px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        h2 {
            color: #1e1b4b;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #374151;
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 11px;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-cadastrar {
            background-color: var(--success);
            margin-top: 10px;
        }
        .btn-cadastrar:hover {
            background-color: #059669;
        }
        .resultado {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
            font-size: 14px;
        }
        .sucesso {
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .erro {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .card-detalhes {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #334155;
            display: none;
        }
        .top-bar {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: white;
            font-weight: bold;
        }
        .btn-sair {
            background-color: rgba(255,255,255,0.2);
            width: auto;
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 6px;
        }
        .btn-sair:hover {
            background-color: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <!-- ECRÃ DE LOGIN -->
    <div id="loginContainer" class="login-card">
        <h2>🔒 Gestão Escolar IA</h2>
        <p style="color: #6b7280; font-size: 13px; margin-bottom: 20px;">Acesso restrito à equipa pedagógica</p>
        <form id="formLogin">
            <div class="form-group">
                <label>Utilizador:</label>
                <input type="text" id="loginUser" required placeholder="admin">
            </div>
            <div class="form-group">
                <label>Palavra-passe:</label>
                <input type="password" id="loginPass" required placeholder="univesp2026">
            </div>
            <button type="submit" style="margin-top: 10px;">Entrar no Sistema</button>
        </form>
        <div id="msgLogin" class="resultado"></div>
    </div>

    <!-- APLICAÇÃO PRINCIPAL (APÓS LOGIN) -->
    <div id="appContainer" class="main-app">
        <div class="top-bar">
            <span>🎓 Painel Administrativo TCC</span>
            <button class="btn-sair" onclick="fazerLogout()">Terminar Sessão</button>
        </div>

        <!-- SECÇÃO 1: CADASTRAR NOVO ALUNO -->
        <div class="container">
            <h2>Cadastrar Novo Aluno</h2>
            <form id="formCadastro">
                <div class="form-group">
                    <label>Nome do Aluno:</label>
                    <input type="text" id="cadNome" required placeholder="Ex: Lucas Mendes">
                </div>
                
                <div class="grid-2">
                    <div class="form-group">
                        <label>Turma:</label>
                        <input type="text" id="cadTurma" required placeholder="Ex: 2º Ano B">
                    </div>
                    <div class="form-group">
                        <label>Turno / Horário:</label>
                        <select id="cadHorario" required>
                            <option value="">Selecione o Turno</option>
                            <option value="Matutino">Matutino</option>
                            <option value="Vespertino">Vespertino</option>
                            <option value="Noturno">Noturno</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Professor Responsável:</label>
                    <input type="text" id="cadProfessor" required placeholder="Ex: Profª Ana Paula">
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Frequência (%):</label>
                        <input type="number" step="0.1" id="cadFrequencia" required placeholder="Ex: 85.0">
                    </div>
                    <div class="form-group">
                        <label>Histórico Reprovações:</label>
                        <input type="number" id="cadReprovacoes" required value="0">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Nota de Matemática:</label>
                        <input type="number" step="0.1" id="cadNotaMat" required placeholder="Ex: 7.5">
                    </div>
                    <div class="form-group">
                        <label>Nota de Português:</label>
                        <input type="number" step="0.1" id="cadNotaPort" required placeholder="Ex: 8.0">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Nota de Inglês:</label>
                        <input type="number" step="0.1" id="cadNotaIng" required placeholder="Ex: 8.0">
                    </div>
                    <div class="form-group">
                        <label>Nota de Educação Física:</label>
                        <input type="number" step="0.1" id="cadNotaEdf" required placeholder="Ex: 9.0">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Nota de História:</label>
                        <input type="number" step="0.1" id="cadNotaHis" required placeholder="Ex: 7.0">
                    </div>
                    <div class="form-group">
                        <label>Nota de Ciências:</label>
                        <input type="number" step="0.1" id="cadNotaCie" required placeholder="Ex: 7.5">
                    </div>
                </div>

                <button type="submit" class="btn-cadastrar">Salvar Novo Aluno</button>
            </form>
            <div id="msgCadastro" class="resultado"></div>
        </div>

        <!-- SECÇÃO 2: ANÁLISE PREDITIVA DE RISCO -->
        <div class="container">
            <h2>Análise Preditiva de Risco Escolar</h2>
            <div class="form-group">
                <label>Selecionar Aluno (SQLite):</label>
                <select id="selectAluno">
                    <option value="">-- A carregar alunos --</option>
                </select>
            </div>

            <div id="cardDetalhes" class="card-detalhes">
                <p><strong>Turma:</strong> <span id="lblTurma"></span> | <strong>Turno:</strong> <span id="lblHorario"></span></p>
                <p><strong>Professor:</strong> <span id="lblProfessor"></span></p>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Frequência (%):</label>
                    <input type="text" id="freq" readonly>
                </div>
                <div class="form-group">
                    <label>Histórico Reprovações:</label>
                    <input type="text" id="rep" readonly>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Matemática:</label>
                    <input type="text" id="mat" readonly>
                </div>
                <div class="form-group">
                    <label>Português:</label>
                    <input type="text" id="port" readonly>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Inglês:</label>
                    <input type="text" id="ing" readonly>
                </div>
                <div class="form-group">
                    <label>Educação Física:</label>
                    <input type="text" id="edf" readonly>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>História:</label>
                    <input type="text" id="his" readonly>
                </div>
                <div class="form-group">
                    <label>Ciências:</label>
                    <input type="text" id="cie" readonly>
                </div>
            </div>

            <button onclick="analisarRisco()" style="margin-top: 10px;">Analisar Risco com IA</button>
            <div id="resultadoAnalise" class="resultado"></div>
        </div>
    </div>

    <script>
        let listaAlunosGlobal = [];

        // LÓGICA DE AUTENTICAÇÃO
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            const usuario = document.getElementById('loginUser').value;
            const senha = document.getElementById('loginPass').value;
            const msgDiv = document.getElementById('msgLogin');

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                if (res.ok) {
                    document.getElementById('loginContainer').style.display = 'none';
                    document.getElementById('appContainer').style.display = 'block';
                    carregarAlunos();
                } else {
                    const data = await res.json();
                    msgDiv.className = 'resultado erro';
                    msgDiv.textContent = data.detail || 'Erro ao autenticar.';
                    msgDiv.style.display = 'block';
                }
            } catch (err) {
                msgDiv.className = 'resultado erro';
                msgDiv.textContent = 'Erro de ligação ao servidor.';
                msgDiv.style.display = 'block';
            }
        });

        function fazerLogout() {
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('formLogin').reset();
            document.getElementById('msgLogin').style.display = 'none';
        }

        // LÓGICA DO SISTEMA ESCOLAR
        async function carregarAlunos() {
            try {
                const res = await fetch('/alunos');
                listaAlunosGlobal = await res.json();
                const select = document.getElementById('selectAluno');
                select.innerHTML = '<option value="">-- Selecione um aluno --</option>';
                listaAlunosGlobal.forEach(aluno => {
                    const opt = document.createElement('option');
                    opt.value = aluno.id;
                    opt.textContent = `${aluno.nome} (${aluno.turma || 'Sem turma'})`;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error("Erro ao carregar alunos:", err);
            }
        }

        document.getElementById('selectAluno').addEventListener('change', function() {
            const idSelecionado = this.value;
            const aluno = listaAlunosGlobal.find(a => a.id == idSelecionado);
            const card = document.getElementById('cardDetalhes');
            
            if (aluno) {
                document.getElementById('freq').value = aluno.frequencia;
                document.getElementById('rep').value = aluno.historico_reprovacoes;
                document.getElementById('mat').value = aluno.nota_mat;
                document.getElementById('port').value = aluno.nota_port;
                document.getElementById('ing').value = aluno.nota_ing;
                document.getElementById('edf').value = aluno.nota_edf;
                document.getElementById('his').value = aluno.nota_his;
                document.getElementById('cie').value = aluno.nota_cie;

                document.getElementById('lblTurma').textContent = aluno.turma || 'N/A';
                document.getElementById('lblHorario').textContent = aluno.horario || 'N/A';
                document.getElementById('lblProfessor').textContent = aluno.nome_professor || 'N/A';
                card.style.display = 'block';
            } else {
                document.querySelectorAll('input[readonly]').forEach(i => i.value = '');
                card.style.display = 'none';
            }
        });

        document.getElementById('formCadastro').addEventListener('submit', async function(e) {
            e.preventDefault();
            const novoAluno = {
                nome: document.getElementById('cadNome').value,
                turma: document.getElementById('cadTurma').value,
                horario: document.getElementById('cadHorario').value,
                nome_professor: document.getElementById('cadProfessor').value,
                frequencia: parseFloat(document.getElementById('cadFrequencia').value),
                nota_mat: parseFloat(document.getElementById('cadNotaMat').value),
                nota_port: parseFloat(document.getElementById('cadNotaPort').value),
                nota_ing: parseFloat(document.getElementById('cadNotaIng').value),
                nota_edf: parseFloat(document.getElementById('cadNotaEdf').value),
                nota_his: parseFloat(document.getElementById('cadNotaHis').value),
                nota_cie: parseFloat(document.getElementById('cadNotaCie').value),
                historico_reprovacoes: parseInt(document.getElementById('cadReprovacoes').value)
            };

            const msgDiv = document.getElementById('msgCadastro');
            try {
                const res = await fetch('/alunos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(novoAluno)
                });
                
                if (res.ok) {
                    msgDiv.className = 'resultado sucesso';
                    msgDiv.textContent = 'Aluno cadastrado com sucesso e integrado na BD!';
                    msgDiv.style.display = 'block';
                    document.getElementById('formCadastro').reset();
                    carregarAlunos();
                } else {
                    msgDiv.className = 'resultado erro';
                    msgDiv.textContent = 'Erro ao registar aluno.';
                    msgDiv.style.display = 'block';
                }
            } catch (err) {
                msgDiv.className = 'resultado erro';
                msgDiv.textContent = 'Erro de comunicação com o servidor.';
                msgDiv.style.display = 'block';
            }
        });

        async function analisarRisco() {
            const alunoId = document.getElementById('selectAluno').value;
            const resDiv = document.getElementById('resultadoAnalise');
            if (!alunoId) {
                alert('Selecione um aluno primeiro!');
                return;
            }

            try {
                const response = await fetch(`/predict/${alunoId}`, { method: 'POST' });
                const data = await response.json();
                resDiv.style.display = 'block';
                if (response.ok) {
                    if (data.risco_evasao === 1) {
                        resDiv.className = 'resultado erro';
                        resDiv.textContent = `⚠️ ALTO RISCO DE EVASÃO - Probabilidade: ${(data.probabilidade * 100).toFixed(1)}%`;
                    } else {
                        resDiv.className = 'resultado sucesso';
                        resDiv.textContent = `✅ BAIXO RISCO DE EVASÃO - Probabilidade de Risco: ${(data.probabilidade * 100).toFixed(1)}%`;
                    }
                } else {
                    resDiv.className = 'resultado erro';
                    resDiv.textContent = data.detail || 'Erro ao processar análise.';
                }
            } catch (err) {
                resDiv.style.display = 'block';
                resDiv.className = 'resultado erro';
                resDiv.textContent = 'Erro ao se comunicar com o servidor da IA.';
            }
        }
    </script>
</body>
</html>
