<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesto Escolar IA - Dashboard UNIVESP</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --card-bg: #ffffff;
            --bg-color: #f1f5f9;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
        }

        /* ECRÃ DE LOGIN */
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }
        .login-card h2 {
            margin-bottom: 8px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 26px;
        }

        /* APLICAÇÃO PRINCIPAL */
        .main-app {
            display: none;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease;
        }

        /* CABEÇALHO DA APP */
        .app-header {
            background: var(--primary-gradient);
            border-radius: 24px;
            padding: 25px 30px;
            color: white;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }
        .app-header p {
            margin: 5px 0 0 0;
            opacity: 0.9;
            font-size: 14px;
        }

        /* NAVEGAÇÃO POR TABS (ESTILO MENU APP) */
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }
        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 16px;
            background: white;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .tab-btn:hover {
            transform: translateY(-2px);
            color: #6366f1;
        }
        .tab-btn.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 8px 15px rgba(99, 102, 241, 0.3);
        }

        /* PAINÉIS DE CONTEÚDO */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: slideUp 0.3s ease;
        }

        /* CARTÕES KPIs DINÂMICOS */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .kpi-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s;
        }
        .kpi-card:hover {
            transform: translateY(-3px);
        }
        .kpi-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: #e0e7ff;
            color: #4f46e5;
        }
        .kpi-info h3 {
            margin: 0;
            font-size: 22px;
            color: var(--text-dark);
        }
        .kpi-info p {
            margin: 2px 0 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* CARTÃO PRINCIPAL */
        .card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            color: var(--text-dark);
        }

        /* FORMULÁRIO RESPONSIVO */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-dark);
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 14px;
            transition: all 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        /* BARRAS DE PROGRESSO VISUAL PARA NOTAS */
        .subject-bar {
            margin-bottom: 12px;
        }
        .subject-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .bar-bg {
            background: #e2e8f0;
            height: 10px;
            border-radius: 10px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: var(--primary-gradient);
            border-radius: 10px;
            width: 0%;
            transition: width 0.6s ease;
        }

        /* BOTÕES */
        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: var(--primary-gradient);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }
        .btn-logout {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }

        /* RESULTADOS */
        .status-box {
            margin-top: 20px;
            padding: 16px;
            border-radius: 16px;
            text-align: center;
            font-weight: 700;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .status-safe {
            background: #dcfce7;
            color: #15803d;
        }
        .status-danger {
            background: #fee2e2;
            color: #b91c1c;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- ECRÃ DE LOGIN ESTILO APP -->
    <div id="loginContainer" class="login-card">
        <div style="font-size: 48px; margin-bottom: 10px;">🎓</div>
        <h2>Gesto Escolar IA</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 25px;">Plataforma Preditiva Pedagógica</p>
        <form id="formLogin">
            <div class="form-group">
                <label>Utilizador</label>
                <input type="text" id="loginUser" required placeholder="admin">
            </div>
            <div class="form-group">
                <label>Palavra-passe</label>
                <input type="password" id="loginPass" required placeholder="univesp2026">
            </div>
            <button type="submit" class="btn-action" style="margin-top: 10px;">Aceder ao Painel</button>
        </form>
        <div id="msgLogin" class="status-box status-danger"></div>
    </div>

    <!-- APLICAÇÃO PRINCIPAL INTERATIVA -->
    <div id="appContainer" class="main-app">
        <!-- HEADER COM GRADIENTE -->
        <div class="app-header">
            <div>
                <h1>Painel Escolar Preditivo</h1>
                <p>Análise de Desempenho e IA em Tempo Real</p>
            </div>
            <button class="btn-logout" onclick="fazerLogout()">Sair 🚪</button>
        </div>

        <!-- NAVEGAÇÃO ESTILO TABS / CARDS -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('tab-analise')">🔍 Analisar Risco com IA</button>
            <button class="tab-btn" onclick="switchTab('tab-cadastro')">➕ Cadastrar Aluno</button>
        </div>

        <!-- ABA 1: ANÁLISE PREDITIVA E BOLETIM VISUAL -->
        <div id="tab-analise" class="tab-content active">
            <!-- CARDS DE METRICAS (KPIs) -->
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-icon">👥</div>
                    <div class="kpi-info">
                        <h3 id="kpiTotal">0</h3>
                        <p>Alunos Registados</p>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon">📊</div>
                    <div class="kpi-info">
                        <h3 id="kpiFreqMedia">0%</h3>
                        <p>Frequência Média</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Selecionar Aluno para Análise</h2>
                <div class="form-group">
                    <select id="selectAluno">
                        <option value="">-- A carregar alunos --</option>
                    </select>
                </div>

                <div id="detalhesAluno" style="display: none; margin-top: 20px;">
                    <div style="background: #f8fafc; padding: 15px; border-radius: 16px; margin-bottom: 20px; font-size: 14px;">
                        <span id="lblTurma"></span> | <span id="lblHorario"></span> | <span id="lblProfessor"></span>
                    </div>

                    <!-- DESEMPENHO VISUAL COM BARRAS COLORIDAS -->
                    <div class="grid-2">
                        <div class="subject-bar">
                            <div class="subject-info"><span>Matemática</span><span id="txtMat">-</span></div>
                            <div class="bar-bg"><div class="bar-fill" id="barMat"></div></div>
                        </div>
                        <div class="subject-bar">
                            <div class="subject-info"><span>Português</span><span id="txtPort">-</span></div>
                            <div class="bar-bg"><div class="bar-fill" id="barPort"></div></div>
                        </div>
                        <div class="subject-bar">
                            <div class="subject-info"><span>Inglês</span><span id="txtIng">-</span></div>
                            <div class="bar-bg"><div class="bar-fill" id="barIng"></div></div>
                        </div>
                        <div class="subject-bar">
                            <div class="subject-info"><span>Educação Física</span><span id="txtEdf">-</span></div>
                            <div class="bar-bg"><div class="bar-fill" id="barEdf"></div></div>
                        </div>
                        <div class="subject-bar">
                            <div class="subject-info"><span>História</span><span id="txtHis">-</span></div>
                            <div class="bar-bg"><div class="bar-fill" id="barHis"></div></div>
                        </div>
                        <div class="subject-bar">
                            <div class="subject-info"><span>Ciências</span><span id="txtCie">-</span></div>
                            <div class="bar-bg"><div class="bar-fill" id="barCie"></div></div>
                        </div>
                    </div>

                    <button class="btn-action" onclick="analisarRisco()" style="margin-top: 25px;">Executar Diagnóstico com IA ✨</button>
                    <div id="resultadoAnalise" class="status-box"></div>
                </div>
            </div>
        </div>

        <!-- ABA 2: CADASTRAR NOVO ALUNO -->
        <div id="tab-cadastro" class="tab-content">
            <div class="card">
                <h2>Novo Registo Académico</h2>
                <form id="formCadastro">
                    <div class="form-group">
                        <label>Nome Completo do Aluno</label>
                        <input type="text" id="cadNome" required placeholder="Ex: Lucas Mendes">
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label>Turma</label>
                            <input type="text" id="cadTurma" required placeholder="Ex: 2º Ano B">
                        </div>
                        <div class="form-group">
                            <label>Turno / Horário</label>
                            <select id="cadHorario" required>
                                <option value="">Selecione...</option>
                                <option value="Matutino">Matutino</option>
                                <option value="Vespertino">Vespertino</option>
                                <option value="Noturno">Noturno</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Professor Responsável</label>
                        <input type="text" id="cadProfessor" required placeholder="Ex: Profª Ana Paula">
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label>Frequência Escolar (%)</label>
                            <input type="number" step="0.1" id="cadFrequencia" required placeholder="85.0">
                        </div>
                        <div class="form-group">
                            <label>Histórico Reprovações</label>
                            <input type="number" id="cadReprovacoes" required value="0">
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="form-group"><label>Matemática</label><input type="number" step="0.1" id="cadNotaMat" required></div>
                        <div class="form-group"><label>Português</label><input type="number" step="0.1" id="cadNotaPort" required></div>
                        <div class="form-group"><label>Inglês</label><input type="number" step="0.1" id="cadNotaIng" required></div>
                        <div class="form-group"><label>Educação Física</label><input type="number" step="0.1" id="cadNotaEdf" required></div>
                        <div class="form-group"><label>História</label><input type="number" step="0.1" id="cadNotaHis" required></div>
                        <div class="form-group"><label>Ciências</label><input type="number" step="0.1" id="cadNotaCie" required></div>
                    </div>

                    <button type="submit" class="btn-action" style="background: var(--success); margin-top: 15px;">Salvar Aluno no Banco 💾</button>
                </form>
                <div id="msgCadastro" class="status-box"></div>
            </div>
        </div>
    </div>

    <script>
        let listaAlunosGlobal = [];

        // TROCA DE SEPARADORES (TABS)
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // AUTENTICAÇÃO
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            const usuario = document.getElementById('loginUser').value;
            const senha = document.getElementById('loginPass').value;
            const msgDiv = document.getElementById('msgLogin');

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                if (res.ok) {
                    document.getElementById('loginContainer').style.display = 'none';
                    document.getElementById('appContainer').style.display = 'block';
                    carregarAlunos();
                } else {
                    msgDiv.textContent = 'Credenciais incorretas!';
                    msgDiv.style.display = 'block';
                }
            } catch (err) {
                msgDiv.textContent = 'Erro ao conectar ao servidor.';
                msgDiv.style.display = 'block';
            }
        });

        function fazerLogout() {
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('loginContainer').style.display = 'block';
        }

        // CARREGAR ALUNOS E ATUALIZAR METRICAS (KPIs)
        async function carregarAlunos() {
            try {
                const res = await fetch('/alunos');
                listaAlunosGlobal = await res.json();
                
                // Atualizar KPIs
                document.getElementById('kpiTotal').textContent = listaAlunosGlobal.length;
                if(listaAlunosGlobal.length > 0) {
                    const mediaFreq = listaAlunosGlobal.reduce((acc, a) => acc + a.frequencia, 0) / listaAlunosGlobal.length;
                    document.getElementById('kpiFreqMedia').textContent = `${mediaFreq.toFixed(1)}%`;
                }

                const select = document.getElementById('selectAluno');
                select.innerHTML = '<option value="">-- Selecione um Aluno --</option>';
                listaAlunosGlobal.forEach(aluno => {
                    const opt = document.createElement('option');
                    opt.value = aluno.id;
                    opt.textContent = `${aluno.nome} (${aluno.turma || 'Sem turma'})`;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error(err);
            }
        }

        // SELEÇÃO DE ALUNO E BARRAS DE PROGRESSO ANIMADAS
        document.getElementById('selectAluno').addEventListener('change', function() {
            const id = this.value;
            const aluno = listaAlunosGlobal.find(a => a.id == id);
            const container = document.getElementById('detalhesAluno');

            if (aluno) {
                container.style.display = 'block';
                document.getElementById('lblTurma').textContent = `Turma: ${aluno.turma || 'N/A'}`;
                document.getElementById('lblHorario').textContent = `Turno: ${aluno.horario || 'N/A'}`;
                document.getElementById('lblProfessor').textContent = `Prof: ${aluno.nome_professor || 'N/A'}`;

                // Atualizar Barras Visuais (Multiplicado por 10 para porcentagem de 0 a 100%)
                setBar('Mat', aluno.nota_mat);
                setBar('Port', aluno.nota_port);
                setBar('Ing', aluno.nota_ing);
                setBar('Edf', aluno.nota_edf);
                setBar('His', aluno.nota_his);
                setBar('Cie', aluno.nota_cie);
            } else {
                container.style.display = 'none';
            }
        });

        function setBar(materia, nota) {
            document.getElementById(`txt${materia}`).textContent = nota;
            document.getElementById(`bar${materia}`).style.width = `${(nota / 10) * 100}%`;
        }

        // CADASTRAR NOVO ALUNO
        document.getElementById('formCadastro').addEventListener('submit', async function(e) {
            e.preventDefault();
            const novoAluno = {
                nome: document.getElementById('cadNome').value,
                turma: document.getElementById('cadTurma').value,
                horario: document.getElementById('cadHorario').value,
                nome_professor: document.getElementById('cadProfessor').value,
                frequencia: parseFloat(document.getElementById('cadFrequencia').value),
                nota_mat: parseFloat(document.getElementById('cadNotaMat').value),
                nota_port: parseFloat(document.getElementById('cadNotaPort').value),
                nota_ing: parseFloat(document.getElementById('cadNotaIng').value),
                nota_edf: parseFloat(document.getElementById('cadNotaEdf').value),
                nota_his: parseFloat(document.getElementById('cadNotaHis').value),
                nota_cie: parseFloat(document.getElementById('cadNotaCie').value),
                historico_reprovacoes: parseInt(document.getElementById('cadReprovacoes').value)
            };

            const msgDiv = document.getElementById('msgCadastro');
            try {
                const res = await fetch('/alunos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(novoAluno)
                });

                if (res.ok) {
                    msgDiv.className = 'status-box status-safe';
                    msgDiv.textContent = 'Aluno cadastrado com sucesso!';
                    msgDiv.style.display = 'block';
                    document.getElementById('formCadastro').reset();
                    carregarAlunos();
                } else {
                    msgDiv.className = 'status-box status-danger';
                    msgDiv.textContent = 'Erro ao cadastrar aluno.';
                    msgDiv.style.display = 'block';
                }
            } catch (err) {
                msgDiv.className = 'status-box status-danger';
                msgDiv.textContent = 'Erro de comunicação.';
                msgDiv.style.display = 'block';
            }
        });

        // PREDIÇÃO DE RISCO COM IA
        async function analisarRisco() {
            const alunoId = document.getElementById('selectAluno').value;
            const resDiv = document.getElementById('resultadoAnalise');

            try {
                const response = await fetch(`/predict/${alunoId}`, { method: 'POST' });
                const data = await response.json();
                resDiv.style.display = 'block';

                if (response.ok) {
                    if (data.risco_evasao === 1) {
                        resDiv.className = 'status-box status-danger';
                        resDiv.textContent = `⚠️ ALTO RISCO DE EVASÃO - Probabilidade: ${(data.probabilidade * 100).toFixed(1)}%`;
                    } else {
                        resDiv.className = 'status-box status-safe';
                        resDiv.textContent = `✅ BAIXO RISCO DE EVASÃO - Probabilidade de Risco: ${(data.probabilidade * 100).toFixed(1)}%`;
                    }
                }
            } catch (err) {
                resDiv.className = 'status-box status-danger';
                resDiv.textContent = 'Erro ao processar predição da IA.';
                resDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
