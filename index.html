<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Gestão Escolar - IA Preditiva</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #0066ff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0052cc;
        }
        .btn-cadastrar {
            background-color: #28a745;
        }
        .btn-cadastrar:hover {
            background-color: #218838;
        }
        .resultado {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .sucesso {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .erro {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .card-detalhes {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #495057;
            display: none;
        }
    </style>
</head>
<body>

    <!-- SECÇÃO 1: CADASTRAR NOVO ALUNO -->
    <div class="container">
        <h2>Cadastrar Novo Aluno</h2>
        <form id="formCadastro">
            <div class="form-group">
                <label>Nome do Aluno:</label>
                <input type="text" id="cadNome" required placeholder="Ex: Lucas Mendes">
            </div>
            <div class="form-group">
                <label>Turma:</label>
                <input type="text" id="cadTurma" required placeholder="Ex: 2º Ano B">
            </div>
            <div class="form-group">
                <label>Turno / Horário:</label>
                <select id="cadHorario" required>
                    <option value="">Selecione o Turno</option>
                    <option value="Matutino">Matutino</option>
                    <option value="Vespertino">Vespertino</option>
                    <option value="Noturno">Noturno</option>
                </select>
            </div>
            <div class="form-group">
                <label>Professor Responsável:</label>
                <input type="text" id="cadProfessor" required placeholder="Ex: Profª Ana Paula">
            </div>
            <div class="form-group">
                <label>Frequência (%):</label>
                <input type="number" step="0.1" id="cadFrequencia" required placeholder="Ex: 85.0">
            </div>
            <div class="form-group">
                <label>Nota de Matemática:</label>
                <input type="number" step="0.1" id="cadNotaMat" required placeholder="Ex: 7.5">
            </div>
            <div class="form-group">
                <label>Nota de Português:</label>
                <input type="number" step="0.1" id="cadNotaPort" required placeholder="Ex: 8.0">
            </div>
            <div class="form-group">
                <label>Histórico de Reprovações:</label>
                <input type="number" id="cadReprovacoes" required value="0">
            </div>
            <button type="submit" class="btn-cadastrar">Salvar Novo Aluno</button>
        </form>
        <div id="msgCadastro" class="resultado"></div>
    </div>

    <!-- SECÇÃO 2: ANÁLISE PREDITIVA DE RISCO -->
    <div class="container">
        <h2>Análise Preditiva de Risco Escolar</h2>
        <div class="form-group">
            <label>Selecionar Aluno (SQLite):</label>
            <select id="selectAluno">
                <option value="">-- A carregar alunos --</option>
            </select>
        </div>

        <!-- Detalhes do Aluno Selecionado -->
        <div id="cardDetalhes" class="card-detalhes">
            <p><strong>Turma:</strong> <span id="lblTurma"></span></p>
            <p><strong>Turno:</strong> <span id="lblHorario"></span></p>
            <p><strong>Professor:</strong> <span id="lblProfessor"></span></p>
        </div>

        <div class="form-group">
            <label>Frequência (%):</label>
            <input type="text" id="freq" readonly>
        </div>
        <div class="form-group">
            <label>Nota de Matemática:</label>
            <input type="text" id="mat" readonly>
        </div>
        <div class="form-group">
            <label>Nota de Português:</label>
            <input type="text" id="port" readonly>
        </div>
        <div class="form-group">
            <label>Histórico de Reprovações:</label>
            <input type="text" id="rep" readonly>
        </div>
        <button onclick="analisarRisco()">Analisar Risco com IA</button>
        <div id="resultadoAnalise" class="resultado"></div>
    </div>

    <script>
        let listaAlunosGlobal = [];

        async function carregarAlunos() {
            try {
                const res = await fetch('/alunos');
                listaAlunosGlobal = await res.json();
                const select = document.getElementById('selectAluno');
                select.innerHTML = '<option value="">-- Selecione um aluno --</option>';
                listaAlunosGlobal.forEach(aluno => {
                    const opt = document.createElement('option');
                    opt.value = aluno.id;
                    opt.textContent = `${aluno.nome} (${aluno.turma || 'Sem turma'})`;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error("Erro ao carregar alunos:", err);
            }
        }

        document.getElementById('selectAluno').addEventListener('change', function() {
            const idSelecionado = this.value;
            const aluno = listaAlunosGlobal.find(a => a.id == idSelecionado);
            const card = document.getElementById('cardDetalhes');
            
            if (aluno) {
                document.getElementById('freq').value = aluno.frequencia;
                document.getElementById('mat').value = aluno.nota_mat;
                document.getElementById('port').value = aluno.nota_port;
                document.getElementById('rep').value = aluno.historico_reprovacoes;

                document.getElementById('lblTurma').textContent = aluno.turma || 'N/A';
                document.getElementById('lblHorario').textContent = aluno.horario || 'N/A';
                document.getElementById('lblProfessor').textContent = aluno.nome_professor || 'N/A';
                card.style.display = 'block';
            } else {
                document.getElementById('freq').value = '';
                document.getElementById('mat').value = '';
                document.getElementById('port').value = '';
                document.getElementById('rep').value = '';
                card.style.display = 'none';
            }
        });

        document.getElementById('formCadastro').addEventListener('submit', async function(e) {
            e.preventDefault();
            const novoAluno = {
                nome: document.getElementById('cadNome').value,
                turma: document.getElementById('cadTurma').value,
                horario: document.getElementById('cadHorario').value,
                nome_professor: document.getElementById('cadProfessor').value,
                frequencia: parseFloat(document.getElementById('cadFrequencia').value),
                nota_mat: parseFloat(document.getElementById('cadNotaMat').value),
                nota_port: parseFloat(document.getElementById('cadNotaPort').value),
                historico_reprovacoes: parseInt(document.getElementById('cadReprovacoes').value)
            };

            const msgDiv = document.getElementById('msgCadastro');
            try {
                const res = await fetch('/alunos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(novoAluno)
                });
                
                if (res.ok) {
                    msgDiv.className = 'resultado sucesso';
                    msgDiv.textContent = 'Aluno cadastrado com sucesso e integrado na BD!';
                    msgDiv.style.display = 'block';
                    document.getElementById('formCadastro').reset();
                    carregarAlunos(); // Atualiza o menu suspenso automaticamente
                } else {
                    msgDiv.className = 'resultado erro';
                    msgDiv.textContent = 'Erro ao registar aluno.';
                    msgDiv.style.display = 'block';
                }
            } catch (err) {
                msgDiv.className = 'resultado erro';
                msgDiv.textContent = 'Erro de comunicação com o servidor.';
                msgDiv.style.display = 'block';
            }
        });

        async function analisarRisco() {
            const alunoId = document.getElementById('selectAluno').value;
            const resDiv = document.getElementById('resultadoAnalise');
            if (!alunoId) {
                alert('Selecione um aluno primeiro!');
                return;
            }

            try {
                const response = await fetch(`/predict/${alunoId}`, { method: 'POST' });
                const data = await response.json();
                resDiv.style.display = 'block';
                if (response.ok) {
                    if (data.risco_evasao === 1) {
                        resDiv.className = 'resultado erro';
                        resDiv.textContent = `⚠️ ALTO RISCO DE EVASÃO - Probabilidade: ${(data.probabilidade * 100).toFixed(1)}%`;
                    } else {
                        resDiv.className = 'resultado sucesso';
                        resDiv.textContent = `✅ BAIXO RISCO DE EVASÃO - Probabilidade de Risco: ${(data.probabilidade * 100).toFixed(1)}%`;
                    }
                } else {
                    resDiv.className = 'resultado erro';
                    resDiv.textContent = data.detail || 'Erro ao processar análise.';
                }
            } catch (err) {
                resDiv.style.display = 'block';
                resDiv.className = 'resultado erro';
                resDiv.textContent = 'Erro ao se comunicar com o servidor da IA.';
            }
        }

        carregarAlunos();
    </script>
</body>
</html>
